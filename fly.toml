# Fly.io deploy (free allowance needs a card; machines stay up while running)
app = "attendwise"
primary_region = "sin"   # Singapore — closest free-region to India; change freely

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SIMULATE_NOTIFICATIONS = "true"
  COOKIE_SECURE = "true"

[mounts]
  source = "attendwise_data"
  destination = "/app/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"   # keep it awake (never sleeps)
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
